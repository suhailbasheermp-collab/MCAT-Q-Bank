<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<title>MCAT Daily</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#1a1a1a;padding-bottom:44px}
 header{background:#1f3a5f;color:#fff;padding:14px 16px;display:flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
 .logo{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid #fff;box-shadow:0 0 6px rgba(255,255,255,0.4)}
 header h1{font-size:19px;margin:0;letter-spacing:0.3px}
 main{padding:14px;max-width:640px;margin:auto}

 /* 4 Central Navigation Tabs */
 .hub-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
 .hub-tab{background:#fff;border:2px solid #d5dce6;border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.04);transition:all 0.15s ease;color:#1f3a5f}
 .hub-tab .tab-icon{font-size:21px;line-height:1}
 .hub-tab .tab-title{font-size:13px;font-weight:700}
 .hub-tab .tab-sub{font-size:10.5px;color:#555;font-weight:500;text-align:center}
 .hub-tab.active{background:#1f3a5f;border-color:#1f3a5f;color:#fff;box-shadow:0 4px 12px rgba(31,58,95,0.28)}
 .hub-tab.active .tab-sub{color:#d6e2f2}

 .tab-panel{display:none}
 .tab-panel.active{display:block}

 .tag{font-size:12px;color:#555;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
 .opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:1px solid #c5cbd6;border-radius:10px;background:#fff;font-size:16px;cursor:pointer}
 .actions{display:flex;gap:10px}
 .actions button{flex:1;padding:14px;border-radius:10px;border:none;font-size:15px;color:#fff;font-weight:600;cursor:pointer}
 .retire{background:#2e9e4f}
 .save{background:#d98e04}
 .stats{font-size:13px;color:#555;margin-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
 .reset-link{background:none;border:none;color:#1f3a5f;text-decoration:underline;font-size:12px;padding:0;cursor:pointer}
 .hidden{display:none}
 select,input{padding:10px;margin-bottom:10px;font-size:15px;border:1px solid #c5cbd6;border-radius:8px;width:100%;box-sizing:border-box;background:#fff}
 .rev{background:#fff;padding:12px;border-radius:8px;margin:10px 0;border:1px solid #dce1ea}
 .rev button{margin-top:8px;padding:8px 12px;border-radius:6px;border:1px solid #999;background:#fff;cursor:pointer}

 /* Sub-bar inside Tabs */
 .sub-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
 .sub-bar h2{font-size:17px;margin:0;color:#1f3a5f}
 .pill-btn{background:#fff;color:#1f3a5f;border:1.5px solid #1f3a5f;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
 .pill-btn.active{background:#1f3a5f;color:#fff}

 /* Flashcard Styling */
 .fs-card{background:#fff;border:1px solid #c5cbd6;border-radius:14px;padding:20px 16px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
 .eq-prompt{font-size:18px;font-weight:600;line-height:1.45;margin:10px 0 18px 0}
 .eq-answer-box{background:#eef3fa;border-left:4px solid #1f3a5f;padding:16px;border-radius:8px;margin-bottom:16px}
 .eq-formula{font-size:17px;font-weight:700;color:#1f3a5f;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:8px;word-break:break-word}
 .eq-note{font-size:14px;color:#333;line-height:1.5;white-space:pre-wrap}
 .reveal-btn{width:100%;padding:16px;background:#1f3a5f;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer}
 .struct-box{background:#fff;border:1px solid #e5e9f0;border-radius:10px;padding:12px;margin:8px 0}

 /* Rich Paste Box for Android Image & Text Pasting */
 .rich-box{min-height:76px;padding:10px;margin-bottom:8px;font-size:15px;border:1px solid #c5cbd6;border-radius:8px;background:#fff;white-space:pre-wrap;word-break:break-word;outline:none}
 .rich-box:empty::before{content:attr(data-placeholder);color:#888}
 .rich-box img{max-width:100%;max-height:160px;display:block;margin-top:6px;border-radius:6px}
 .paste-btn{width:100%;padding:10px;margin-bottom:10px;background:#eef3fa;color:#1f3a5f;border:1px dashed #1f3a5f;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}

 /* Priority Selector & Badges */
 .prio-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
 .prio-opt{padding:9px 6px;border:1.5px solid #c5cbd6;border-radius:8px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;text-align:center}
 .prio-opt.sel-none{border-color:#1f3a5f;background:#eef3fa;color:#1f3a5f}
 .prio-opt.sel-high{border-color:#c0392b;background:#fdecea;color:#c0392b}
 .prio-opt.sel-review{border-color:#d98e04;background:#fef6e4;color:#9a6300}

 .prio-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
 .prio-badge.high{background:#fdecea;color:#c0392b;border:1px solid #f5c2be}
 .prio-badge.review{background:#fef6e4;color:#9a6300;border:1px solid #f7dfa5}
 .prio-badge.master{background:#d6f5dd;color:#1e7035;border:1px solid #a8e4b7}

 /* Resources Section & Nested Toggles */
 .res-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
 .res-header h2{font-size:17px;margin:0;color:#1f3a5f}
 .btn-primary{background:#1f3a5f;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
 .backup-bar{display:flex;gap:8px;margin-bottom:12px}
 .btn-sec{flex:1;background:#fff;color:#1f3a5f;border:1.5px solid #1f3a5f;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;cursor:pointer}
 .res-form{background:#fff;padding:14px;border-radius:10px;border:1px solid #c5cbd6;margin-bottom:14px}
 .form-mode-label{font-size:13px;font-weight:700;color:#1f3a5f;margin-bottom:8px}
 .hint{font-size:12px;color:#555;margin:-4px 0 10px 2px}
 .filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

 details.tree-node{background:#fff;border:1px solid #dce1ea;border-radius:8px;margin-bottom:8px;overflow:hidden}
 details.tree-node details.tree-node{margin:6px 0 6px 12px;border-color:#e2e6ee;background:#fafbfd}
 details.tree-node > summary{padding:11px 14px;font-weight:600;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
 details.tree-node > summary::-webkit-details-marker{display:none}
 .sum-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
 .sum-arrow{color:#1f3a5f;font-size:14px}
 .tree-body{padding:4px 12px 12px 12px;border-top:1px solid #eef1f6}
 .res-item{padding:10px 0 4px 10px;border-left:3px solid transparent;margin-top:6px}
 .res-item.p-high{border-left-color:#c0392b}
 .res-item.p-review{border-left-color:#d98e04}
 .res-item img{width:100%;max-height:260px;object-fit:contain;border-radius:6px;margin-top:8px;background:#fff;border:1px solid #eee;cursor:pointer}
 .res-note{white-space:pre-wrap;font-size:14px;background:#f4f6fa;padding:10px;border-radius:6px;margin-top:6px;font-family:ui-monospace,monospace}
 .item-actions{display:flex;gap:14px;margin-top:8px}
 .res-edit{color:#1f3a5f;border:none;background:none;font-size:13px;font-weight:600;padding:4px 0;cursor:pointer}
 .res-del{color:#c0392b;border:none;background:none;font-size:13px;padding:4px 0;cursor:pointer}

 /* Fullscreen Image Zoom Modal */
 #imgModal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:999;padding:12px}
 #imgModal img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<header>
 <img class="logo" src="logo.png" alt="MCAT Daily" onerror="this.style.display='none'">
 <h1>MCAT Daily</h1>
</header>

<main>
 <!-- 4 Central Navigation Tabs -->
 <div class="hub-tabs" role="tablist">
  <button class="hub-tab active" id="tab-res" onclick="switchTab('res')">
   <span class="tab-icon">🗂️</span>
   <span class="tab-title">Resources</span>
   <span class="tab-sub" id="sub-res">Vault</span>
  </button>
  <button class="hub-tab" id="tab-eq" onclick="switchTab('eq')">
   <span class="tab-icon">∑</span>
   <span class="tab-title">Equations</span>
   <span class="tab-sub" id="sub-eq">125 Formulas</span>
  </button>
  <button class="hub-tab" id="tab-st" onclick="switchTab('st')">
   <span class="tab-icon">🧬</span>
   <span class="tab-title">Structures</span>
   <span class="tab-sub" id="sub-st">62 Molecules</span>
  </button>
  <button class="hub-tab" id="tab-wk" onclick="switchTab('wk')">
   <span class="tab-icon">🧮</span>
   <span class="tab-title">Works</span>
   <span class="tab-sub" id="sub-wk">100 Setups</span>
  </button>
 </div>

 <!-- TAB 1: RESOURCES & ADD RESOURCE -->
 <section id="panel-res" class="tab-panel active">
  <div class="res-header">
   <h2>Study Vault</h2>
   <button class="btn-primary" onclick="openNewResource()">+ Add Resource</button>
  </div>

  <div class="backup-bar">
   <button class="btn-sec" onclick="exportBackup()">💾 Download / Update Backup</button>
   <label class="btn-sec" style="margin:0">Restore Backup<input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="importBackup(event)"></label>
  </div>

  <div id="resForm" class="res-form hidden">
   <div id="formModeLabel" class="form-mode-label">New Resource</div>
   <input type="text" id="resTitle" list="titleSuggestions" autocomplete="off" placeholder="Title / Path (e.g., Hormones / Pituitary / Posterior)">
   <datalist id="titleSuggestions"></datalist>
   <div class="hint">Type to pick an existing folder/subtitle or use <b>/</b> to nest new ones.</div>

   <select id="resSubj">
    <option value="Biochemistry">Biochemistry</option>
    <option value="Biology">Biology</option>
    <option value="General Chemistry">General Chemistry</option>
    <option value="Organic Chemistry">Organic Chemistry</option>
    <option value="Physics">Physics</option>
    <option value="Psychology and Sociology">Psychology and Sociology</option>
   </select>

   <div class="prio-row">
    <button type="button" class="prio-opt sel-none" id="prio-none" onclick="setPriority('none')">⚪ Normal</button>
    <button type="button" class="prio-opt" id="prio-high" onclick="setPriority('high')">🔴 High Priority</button>
    <button type="button" class="prio-opt" id="prio-review" onclick="setPriority('review')">🟡 Needs Review</button>
   </div>

   <div id="resNote" class="rich-box" contenteditable="true" data-placeholder="Type notes OR paste copied image here..."></div>
   <button type="button" class="paste-btn" onclick="pasteFromClipboard()">📋 Paste Copied Image from Clipboard</button>
   <div id="pastePreview"></div>
   <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Or attach/replace chart from phone (optional):</label>
   <input type="file" id="resFile" accept="image/*">
   <div class="actions">
    <button class="retire" onclick="saveResource()">Save</button>
    <button style="background:#7f8c8d" onclick="closeResForm()">Cancel</button>
   </div>
  </div>

  <div class="filter-row">
   <select id="resFilter" onchange="renderResources()">
    <option value="all">All subjects</option>
    <option value="Biochemistry">Biochemistry</option>
    <option value="Biology">Biology</option>
    <option value="General Chemistry">General Chemistry</option>
    <option value="Organic Chemistry">Organic Chemistry</option>
    <option value="Physics">Physics</option>
    <option value="Psychology and Sociology">Psychology and Sociology</option>
   </select>
   <select id="resPrioFilter" onchange="renderResources()">
    <option value="all">All priorities</option>
    <option value="high">🔴 High Priority</option>
    <option value="review">🟡 Needs Review</option>
    <option value="none">⚪ Normal</option>
   </select>
  </div>
  <div id="resList"></div>
 </section>

 <!-- TAB 2: EQUATIONS DRILL -->
 <section id="panel-eq" class="tab-panel">
  <div class="sub-bar">
   <h2>Equation Flashcards</h2>
   <button class="pill-btn" id="eqModeBtn" onclick="toggleEqMode()">Saved (0)</button>
  </div>
  <select id="eqSubj" onchange="nextEq()">
   <option value="all">All subjects</option>
   <option value="Physics">Physics</option>
   <option value="General Chemistry">General Chemistry</option>
   <option value="Organic Chemistry">Organic Chemistry</option>
   <option value="Biochemistry">Biochemistry</option>
   <option value="Biology">Biology</option>
   <option value="Psychology and Sociology">Psychology and Sociology</option>
  </select>
  <div id="eqDeckView">
   <div id="eqCard"></div>
   <div class="stats">
    <span id="eqStats"></span>
    <button class="reset-link" onclick="resetRetired('eq')">Reset Retired</button>
   </div>
  </div>
  <div id="eqSavedView" class="hidden">
   <h3>Saved Equations</h3>
   <div id="eqSavedList"></div>
  </div>
 </section>

 <!-- TAB 3: STRUCTURES DRILL -->
 <section id="panel-st" class="tab-panel">
  <div class="sub-bar">
   <h2>Structure Identification</h2>
   <button class="pill-btn" id="stModeBtn" onclick="toggleStMode()">Saved (0)</button>
  </div>
  <select id="stCat" onchange="nextSt()">
   <option value="all">All structures (62)</option>
   <option value="Amino Acids">Amino Acids (20)</option>
   <option value="Bases & Nucleotides">Bases &amp; Nucleosides (6)</option>
   <option value="Carbohydrates">Carbohydrates (8)</option>
   <option value="Vitamins & Cofactors">Vitamins &amp; Cofactors (5)</option>
   <option value="Neurotransmitters & Hormones">Neurotransmitters &amp; Hormones (6)</option>
   <option value="Metabolism & Organic">Metabolism &amp; Lipids (13)</option>
   <option value="Organic Functional Groups">Functional Groups (4)</option>
  </select>
  <div id="stDeckView">
   <div id="stCard"></div>
   <div class="stats">
    <span id="stStats"></span>
    <button class="reset-link" onclick="resetRetired('st')">Reset Retired</button>
   </div>
  </div>
  <div id="stSavedView" class="hidden">
   <h3>Saved Structures</h3>
   <div id="stSavedList"></div>
  </div>
 </section>

 <!-- TAB 4: WORKS (CALCULATION BLUEPRINTS & SPACED TRACKER) -->
 <section id="panel-wk" class="tab-panel">
  <div class="sub-bar">
   <h2>Calculation Blueprints</h2>
   <button class="pill-btn" id="wkModeBtn" onclick="toggleWkMode()">Browse All</button>
  </div>
  <div class="filter-row">
   <select id="wkFilter" onchange="onWkFilterChange()">
    <option value="due">Due Now (Practice + New + Due)</option>
    <option value="practice">🟡 Needs Practice Only</option>
    <option value="mastered">🟢 Mastered (Scheduled)</option>
    <option value="all">All 100 Setups</option>
   </select>
   <select id="wkSubj" onchange="onWkFilterChange()">
    <option value="all">All subjects</option>
    <option value="General Chemistry">General Chemistry</option>
    <option value="Physics">Physics</option>
    <option value="Organic Chemistry">Organic Chemistry</option>
    <option value="Biochemistry">Biochemistry</option>
    <option value="Biology">Biology</option>
    <option value="Psychology and Sociology">Psychology &amp; Stats</option>
   </select>
  </div>
  <div id="wkDeckView">
   <div id="wkCard"></div>
   <div class="stats">
    <span id="wkStats"></span>
    <button class="reset-link" onclick="resetRetired('wk')">Reset Works Progress</button>
   </div>
  </div>
  <div id="wkListView" class="hidden">
   <div id="wkAllList"></div>
  </div>
 </section>
</main>

<div id="imgModal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>

<script src="equations.js"></script>
<script src="structures.js"></script>
<script src="works.js"></script>
<script>
const KEY='mcatState';
let state;
try {
 state=JSON.parse(localStorage.getItem(KEY)||'{"eqRetired":[],"eqSaved":[],"stRetired":[],"stSaved":[],"wkState":{}}');
} catch(e) {
 state={"eqRetired":[],"eqSaved":[],"stRetired":[],"stSaved":[],"wkState":{}};
}
if(!state.eqRetired)state.eqRetired=[];
if(!state.eqSaved)state.eqSaved=[];
if(!state.stRetired)state.stRetired=[];
if(!state.stSaved)state.stSaved=[];
if(!state.wkState)state.wkState={};

function persist(){localStorage.setItem(KEY,JSON.stringify(state));}

/* Central Tab Switcher */
function switchTab(which){
 ['res','eq','st','wk'].forEach(t=>{
  document.getElementById('tab-'+t).classList.toggle('active',t===which);
  document.getElementById('panel-'+t).classList.toggle('active',t===which);
 });
 if(which==='eq'){
  eqShowingSaved=false;
  document.getElementById('eqDeckView').classList.remove('hidden');
  document.getElementById('eqSavedView').classList.add('hidden');
  nextEq();
 }
 if(which==='st'){
  stShowingSaved=false;
  document.getElementById('stDeckView').classList.remove('hidden');
  document.getElementById('stSavedView').classList.add('hidden');
  nextSt();
 }
 if(which==='wk'){
  wkShowingList=false;
  document.getElementById('wkDeckView').classList.remove('hidden');
  document.getElementById('wkListView').classList.add('hidden');
  document.getElementById('wkModeBtn').classList.remove('active');
  document.getElementById('wkModeBtn').textContent='Browse All';
  nextWk();
 }
}

function resetRetired(type){
 if(!confirm('Reset progress for this section?'))return;
 if(type==='eq'){state.eqRetired=[];persist();nextEq();}
 if(type==='st'){state.stRetired=[];persist();nextSt();}
 if(type==='wk'){state.wkState={};persist();nextWk();}
}

/* Equations Flashcard Logic */
let curEq=null, eqShowingSaved=false;
function eqPool(){return typeof EQUATIONS!=='undefined'?EQUATIONS:[];}
function eqInCircle(e){return e && e.id && !state.eqRetired.includes(e.id)&&!state.eqSaved.includes(e.id);}
function toggleEqMode(){
 eqShowingSaved=!eqShowingSaved;
 document.getElementById('eqDeckView').classList.toggle('hidden',eqShowingSaved);
 document.getElementById('eqSavedView').classList.toggle('hidden',!eqShowingSaved);
 const btn=document.getElementById('eqModeBtn');
 btn.classList.toggle('active',eqShowingSaved);
 btn.textContent=eqShowingSaved?'Back to Drill':'Saved ('+state.eqSaved.length+')';
 if(eqShowingSaved)renderEqSaved();
}
function updateEqStats(){
 const all=eqPool();
 const inC=all.filter(eqInCircle).length;
 document.getElementById('eqStats').textContent='Circle: '+inC+' | Saved: '+state.eqSaved.length+' | Retired: '+state.eqRetired.length;
 document.getElementById('sub-eq').textContent=inC+' left';
 if(!eqShowingSaved){
  const btn=document.getElementById('eqModeBtn');
  btn.classList.remove('active');
  btn.textContent='Saved ('+state.eqSaved.length+')';
 }
}
function nextEq(){
 const subj=document.getElementById('eqSubj').value;
 const pool=eqPool().filter(e=>eqInCircle(e)&&(subj==='all'||e.subject===subj));
 const card=document.getElementById('eqCard');
 if(!pool.length){
  card.innerHTML='<div class="fs-card"><p>No equations left in this circle. Check Saved or tap Reset Retired.</p></div>';
  curEq=null;updateEqStats();return;
 }
 curEq=pool[Math.floor(Math.random()*pool.length)];
 card.innerHTML='<div class="fs-card"><div class="tag"><span>'+curEq.subject+' \u00b7 '+curEq.topic+'</span></div>'+
  '<div class="eq-prompt">'+curEq.q+'</div>'+
  '<button class="reveal-btn" id="revealEqBtn" onclick="revealEq()">Show Equation</button>'+
  '<div id="eqAfter" class="hidden"></div></div>';
 updateEqStats();
}
function revealEq(){
 document.getElementById('revealEqBtn').classList.add('hidden');
 const after=document.getElementById('eqAfter');
 after.classList.remove('hidden');
 after.innerHTML='<div class="eq-answer-box"><div class="eq-formula">'+curEq.eq+'</div>'+
  (curEq.note?'<div class="eq-note">'+curEq.note+'</div>':'')+'</div>'+
  '<div class="actions"><button class="retire" onclick="retireEq()">Mastered, retire it</button><button class="save" onclick="saveEq()">Save for review</button></div>'+
  '<button class="opt" onclick="nextEq()" style="margin-top:12px">Keep in circle, next equation</button>';
}
function retireEq(){state.eqRetired.push(curEq.id);persist();nextEq();}
function saveEq(){state.eqSaved.push(curEq.id);persist();nextEq();}
function renderEqSaved(){
 const list=document.getElementById('eqSavedList');
 const items=eqPool().filter(e=>e && state.eqSaved.includes(e.id));
 if(!items.length){list.innerHTML='<p>No equations saved yet.</p>';return;}
 list.innerHTML=items.map(e=>'<div class="rev"><div class="tag"><span>'+e.subject+' \u00b7 '+e.topic+'</span></div><div><b>'+e.q+'</b></div>'+
  '<div class="eq-formula" style="font-size:17px;margin-top:8px">'+e.eq+'</div>'+
  (e.note?'<div class="eq-note" style="margin-bottom:8px">'+e.note+'</div>':'')+
  '<button onclick="unsaveEq('+e.id+')">Put back in circle</button> <button onclick="retireSavedEq('+e.id+')">Retire</button></div>').join('');
}
function unsaveEq(id){state.eqSaved=state.eqSaved.filter(x=>x!==id);persist();renderEqSaved();updateEqStats();}
function retireSavedEq(id){state.eqSaved=state.eqSaved.filter(x=>x!==id);state.eqRetired.push(id);persist();renderEqSaved();updateEqStats();}

/* Structures Flashcard Logic */
let curSt=null, stShowingSaved=false;
function stPool(){return typeof STRUCTURES!=='undefined'?STRUCTURES:[];}
function stInCircle(s){return s && s.id && !state.stRetired.includes(s.id)&&!state.stSaved.includes(s.id);}
function toggleStMode(){
 stShowingSaved=!stShowingSaved;
 document.getElementById('stDeckView').classList.toggle('hidden',stShowingSaved);
 document.getElementById('stSavedView').classList.toggle('hidden',!stShowingSaved);

 btn.textContent=stShowingSaved?'Back to Drill':'Saved ('+state.stSaved.length+')';

function updateStStats(){
 const all=stPool();
 const inC=all.filter(stInCircle).length;
 document.getElementById('stStats').textContent='Circle: '+inC+' | Saved: '+state.stSaved.length+' | Retired: '+state.stRetired.length;

 if(!stShowingSaved){
  const btn=document.getElementById('stModeBtn');
  btn.classList.remove('active');
  btn.textContent='Saved ('+state.stSaved.length+')';
 }
}
function nextSt(){
 const cat=document.getElementById('stCat').value;
 const pool=stPool().filter(s=>stInCircle(s)&&(cat==='all'||s.cat===cat));
 const card=document.getElementById('stCard');
 if(!pool.length){
  card.innerHTML='<div class="fs-card"><p>No structures left in this circle. Check Saved or tap Reset Retired.</p></div>';
  curSt=null;updateStStats();return;
 }
 curSt=pool[Math.floor(Math.random()*pool.length)];
 card.innerHTML='<div class="fs-card"><div class="tag"><span>Identify this structure</span></div>'+
  '<div class="struct-box">'+curSt.svg+'</div>'+
  '<button class="reveal-btn" id="revealStBtn" onclick="revealSt()">Flip / Show Structure Name</button>'+
  '<div id="stAfter" class="hidden"></div></div>';
 updateStStats();
}
function revealSt(){
 document.getElementById('revealStBtn').classList.add('hidden');
 const after=document.getElementById('stAfter');
 after.classList.remove('hidden');
 after.innerHTML='<div class="eq-answer-box" style="margin-top:12px"><div class="tag" style="margin-bottom:4px"><span>'+curSt.cat+'</span></div>'+
  '<div class="eq-formula" style="font-family:system-ui,sans-serif">'+curSt.name+'</div>'+
  '<div class="eq-note">'+curSt.info+'</div></div>'+
  '<div class="actions"><button class="retire" onclick="retireSt()">Mastered, retire it</button><button class="save" onclick="saveSt()">Save for review</button></div>'+
  '<button class="opt" onclick="nextSt()" style="margin-top:12px">Keep in circle, next structure</button>';
}
function retireSt(){state.stRetired.push(curSt.id);persist();nextSt();}
function saveSt(){state.stSaved.push(curSt.id);persist();nextSt();}
function renderStSaved(){
 const list=document.getElementById('stSavedList');
 const items=stPool().filter(s=>s && state.stSaved.includes(s.id));
 if(!items.length){list.innerHTML='<p>No structures saved yet.</p>';return;}
 list.innerHTML=items.map(s=>'<div class="rev"><div class="tag"><span>'+s.cat+'</span></div><div><b>'+s.name+'</b></div>'+
  '<div class="struct-box">'+s.svg+'</div>'+
  '<div class="eq-note" style="margin-bottom:8px">'+s.info+'</div>'+
  '<button onclick="unsaveSt('+s.id+')">Put back in circle</button> <button onclick="retireSavedSt('+s.id+')">Retire</button></div>').join('');
}
function unsaveSt(id){state.stSaved=state.stSaved.filter(x=>x!==id);persist();renderStSaved();updateStStats();}
function retireSavedSt(id){state.stSaved=state.stSaved.filter(x=>x!==id);state.stRetired.push(id);persist();renderStSaved();updateStStats();}

/* Works (Calculation Blueprints + Spaced Periodic Tracker: 3 -> 7 -> 14 -> 30 days) */
const WK_INTERVALS = [3, 7, 14, 30];
let curWk=null, wkShowingList=false;

function wkPool(){return typeof WORKS!=='undefined'?WORKS:[];}
function getWkEntry(id){return state.wkState[id] || {status:'new',level:0,due:0};}
function isWkDue(w){
 const e=getWkEntry(w.id);
 if(e.status==='new'||e.status==='practice')return true;
 return Date.now() >= (e.due||0);
}
function formatDueText(e){
 if(e.status==='new')return '<span class="prio-badge">New</span>';
 if(e.status==='practice')return '<span class="prio-badge review">🟡 Needs Practice</span>';
 const diffDays = Math.ceil(((e.due||0) - Date.now()) / 86400000);
 if(diffDays <= 0)return '<span class="prio-badge review">🔄 Due for Review</span>';
 return '<span class="prio-badge master">🟢 Mastered (Review in '+diffDays+'d)</span>';
}

function updateWkStats(){
 const all=wkPool();
 let dueCount=0, pracCount=0, mastCount=0;
 all.forEach(w=>{
  const e=getWkEntry(w.id);
  if(isWkDue(w))dueCount++;
  if(e.status==='practice')pracCount++;
  if(e.status==='mastered')mastCount++;
 });
 document.getElementById('wkStats').textContent='Due Now: '+dueCount+' | Needs Practice: '+pracCount+' | Mastered: '+mastCount+' / '+all.length;
 document.getElementById('sub-wk').textContent=dueCount+' due';
}

function onWkFilterChange(){
 if(wkShowingList)renderWkList();
 else nextWk();
}

function toggleWkMode(){
 wkShowingList=!wkShowingList;
 document.getElementById('wkDeckView').classList.toggle('hidden',wkShowingList);
 document.getElementById('wkListView').classList.toggle('hidden',!wkShowingList);
 const btn=document.getElementById('wkModeBtn');
 btn.classList.toggle('active',wkShowingList);
 btn.textContent=wkShowingList?'Back to Drill':'Browse All';
 if(wkShowingList)renderWkList();
 else nextWk();
}

function getFilteredWorks(){
 const mode=document.getElementById('wkFilter').value;
 const subj=document.getElementById('wkSubj').value;
 return wkPool().filter(w=>{
  if(subj!=='all' && w.subject!==subj)return false;
  const e=getWkEntry(w.id);
  if(mode==='due')return isWkDue(w);
  if(mode==='practice')return e.status==='practice';
  if(mode==='mastered')return e.status==='mastered';
  return true;
 });
}

function nextWk(){
 const pool=getFilteredWorks();
 const card=document.getElementById('wkCard');
 if(!pool.length){
  card.innerHTML='<div class="fs-card"><p>No calculation blueprints match this filter right now. Switch filter to "All 100 Setups" or "Mastered" to review early.</p></div>';
  curWk=null;updateWkStats();return;
 }
 const practicePool=pool.filter(w=>getWkEntry(w.id).status==='practice');
 const pickPool=(practicePool.length && Math.random()<0.65)?practicePool:pool;
 curWk=pickPool[Math.floor(Math.random()*pickPool.length)];
 const e=getWkEntry(curWk.id);
 const nextDays=WK_INTERVALS[Math.min(e.level||0, WK_INTERVALS.length-1)];

 card.innerHTML='<div class="fs-card"><div class="tag"><span>'+curWk.subject+' \u00b7 '+curWk.topic+'</span>'+formatDueText(e)+'</div>'+
  '<div class="eq-prompt">'+curWk.q+'</div>'+
  '<button class="reveal-btn" id="revealWkBtn" onclick="revealWk('+nextDays+')">Flip / Show Solution Blueprint</button>'+
  '<div id="wkAfter" class="hidden"></div></div>';
 updateWkStats();
}

function revealWk(nextDays){
 document.getElementById('revealWkBtn').classList.add('hidden');
 const after=document.getElementById('wkAfter');
 after.classList.remove('hidden');
 after.innerHTML='<div class="eq-answer-box" style="margin-top:12px">'+
  '<div class="eq-formula">'+curWk.tool+'</div>'+
  '<div class="eq-note">'+curWk.steps+'</div></div>'+
  '<div class="actions">'+
  '<button class="retire" onclick="markWkMastered()">🟢 Mastered ('+nextDays+'d)</button>'+
  '<button class="save" onclick="markWkPractice()">🟡 Needs Practice</button>'+
  '</div>'+
  '<button class="opt" onclick="nextWk()" style="margin-top:12px">Skip / Next Blueprint</button>';
}

function markWkMastered(){
 const e=getWkEntry(curWk.id);
 const lvl=e.status==='mastered'?Math.min((e.level||0)+1, WK_INTERVALS.length-1):0;
 const days=WK_INTERVALS[lvl];
 state.wkState[curWk.id]={status:'mastered',level:lvl,due:Date.now()+(days*86400000)};
 persist();
 nextWk();
}

function markWkPractice(){
 state.wkState[curWk.id]={status:'practice',level:0,due:0};
 persist();
 nextWk();
}

function setWkStatusFromList(id,status){
 if(status==='practice'){
  state.wkState[id]={status:'practice',level:0,due:0};
 }else{
  state.wkState[id]={status:'mastered',level:0,due:Date.now()+(3*86400000)};
 }
 persist();
 renderWkList();
 updateWkStats();
}

function renderWkList(){
 const list=document.getElementById('wkAllList');
 const items=getFilteredWorks();
 if(!items.length){list.innerHTML='<p class="stats">No blueprints match this filter.</p>';return;}
 list.innerHTML=items.map(w=>{
  const e=getWkEntry(w.id);
  return '<div class="rev"><div class="tag"><span>'+w.subject+' \u00b7 '+w.topic+'</span>'+formatDueText(e)+'</div>'+
   '<div style="font-weight:600;margin-bottom:6px">'+w.q+'</div>'+
   '<details><summary style="cursor:pointer;color:#1f3a5f;font-size:13px;font-weight:600">Show Solution Blueprint</summary>'+
   '<div class="eq-answer-box" style="margin-top:8px;margin-bottom:8px"><div class="eq-formula" style="font-size:15px">'+w.tool+'</div>'+
   '<div class="eq-note">'+w.steps+'</div></div></details>'+
   '<button onclick="setWkStatusFromList('+w.id+',\'practice\')">🟡 Needs Practice</button> '+
   '<button onclick="setWkStatusFromList('+w.id+',\'mastered\')">🟢 Mark Mastered (3d)</button></div>';
 }).join('');
}

/* IndexedDB Storage + Autocomplete + Move/Edit + Priority Flags */
let db;
const req=indexedDB.open('mcatResourcesDB',1);
req.onupgradeneeded=e=>{e.target.result.createObjectStore('items',{keyPath:'id',autoIncrement:true});};
req.onsuccess=e=>{db=e.target.result;renderResources();};

let pastedImgData = null;
let editingId = null;
let currentPriority = 'none';

function setPriority(p){
 currentPriority = p;
 ['none','high','review'].forEach(k=>{
  const el=document.getElementById('prio-'+k);
  el.className='prio-opt'+(k===p?' sel-'+k:'');
 });
}

function setPastedPreview(dataUrl){
 pastedImgData = dataUrl;
 document.getElementById('pastePreview').innerHTML =
  '<div style="margin:6px 0">' +
  '<img src="' + dataUrl + '" style="max-height:150px;border-radius:6px;border:1px solid #c5cbd6">' +
  '<button type="button" onclick="clearPastedImg()" style="display:block;color:#c0392b;background:none;border:none;font-size:12px;padding:4px 0;cursor:pointer">Remove image</button></div>';
}

function clearPastedImg(){
 pastedImgData = null;
 document.getElementById('pastePreview').innerHTML = '';
}

function openNewResource(){
 editingId = null;
 document.getElementById('formModeLabel').textContent = 'Add New Resource';
 document.getElementById('resTitle').value = '';
 noteBox.innerHTML = '';
 document.getElementById('resFile').value = '';
 setPriority('none');
 clearPastedImg();
 document.getElementById('resForm').classList.remove('hidden');
 document.getElementById('resTitle').focus();
}

function editResource(id){
 if(!db)return;
 db.transaction('items','readonly').objectStore('items').get(id).onsuccess=e=>{
  const item = e.target.result;
  if(!item)return;
  editingId = item.id;
  document.getElementById('formModeLabel').textContent = 'Edit / Move Resource';
  document.getElementById('resTitle').value = item.title || '';
  document.getElementById('resSubj').value = item.subject || 'Biochemistry';
  noteBox.innerText = item.note || '';
  document.getElementById('resFile').value = '';
  setPriority(item.priority || 'none');
  if(item.imgData){
   setPastedPreview(item.imgData);
  }else{
   clearPastedImg();
  }
  const form = document.getElementById('resForm');
  form.classList.remove('hidden');
  form.scrollIntoView({behavior:'smooth',block:'center'});
 };
}

function closeResForm(){
 editingId = null;
 document.getElementById('resForm').classList.add('hidden');
 clearPastedImg();
}

function compressImage(file){
 return new Promise(resolve=>{
  const reader=new FileReader();
  reader.onload=e=>{
   const img=new Image();
   img.onload=()=>{
    const canvas=document.createElement('canvas');
    const maxW=1200;
    const scale=img.width>maxW?maxW/img.width:1;
    canvas.width=img.width*scale;
    canvas.height=img.height*scale;
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL('image/jpeg',0.8));
   };
   img.src=e.target.result;
  };
  reader.readAsDataURL(file);
 });
}

const noteBox = document.getElementById('resNote');
noteBox.addEventListener('paste', async function(e){
 const cd = e.clipboardData || e.originalEvent.clipboardData;
 if(cd && cd.items){
  for(let i=0;i<cd.items.length;i++){
   if(cd.items[i].type.indexOf('image')!==-1){
    e.preventDefault();
    const blob = cd.items[i].getAsFile();
    const dataUrl = await compressImage(blob);
    setPastedPreview(dataUrl);
    return;
   }
  }
 }
 setTimeout(async ()=>{
  const embedded = noteBox.querySelector('img');
  if(embedded){
   const src = embedded.src;
   embedded.remove();
   if(src.startsWith('data:image')) setPastedPreview(src);
  }
 }, 60);
});

async function pasteFromClipboard(){
 try{
  if(!navigator.clipboard || !navigator.clipboard.read){
   alert('Tap inside the notes box above and tap Paste on your keyboard.');
   return;
  }
  const items = await navigator.clipboard.read();
  for(const item of items){
   const imgType = item.types.find(t => t.startsWith('image/'));
   if(imgType){
    const blob = await item.getType(imgType);
    const dataUrl = await compressImage(blob);
    setPastedPreview(dataUrl);
    return;
   }
  }
  alert('No image found in clipboard. Copy an image from Chrome first.');
 }catch(err){
  alert('Tap inside the notes box above and select Paste from your keyboard.');
 }
}

async function saveResource(){
 const title=document.getElementById('resTitle').value.trim();
 const subject=document.getElementById('resSubj').value;
 const note=noteBox.innerText.trim();
 const file=document.getElementById('resFile').files[0];
 if(!title&&!note&&!file&&!pastedImgData){alert('Add a title, equation, or photo first.');return;}
 let imgData=pastedImgData;
 if(file)imgData=await compressImage(file);
 const tx=db.transaction('items','readwrite');
 const store=tx.objectStore('items');
 const record={title:title||'Untitled Resource',subject,priority:currentPriority,note,imgData};
 if(editingId!==null){
  record.id=editingId;
  store.put(record);
 }else{
  store.add(record);
 }
 tx.oncomplete=()=>{
  document.getElementById('resTitle').value='';
  noteBox.innerHTML='';
  document.getElementById('resFile').value='';
  closeResForm();
  renderResources();
 };
}

function escapeHtml(s){
 return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
}

function updateTitleSuggestions(allItems){
 const paths = new Set();
 allItems.forEach(item=>{
  if(!item.title)return;
  const parts = item.title.split('/').map(p=>p.trim()).filter(Boolean);
  let acc = '';
  parts.forEach((p,idx)=>{
   acc = idx===0 ? p : acc + ' / ' + p;
   paths.add(acc);
  });
 });
 const dl = document.getElementById('titleSuggestions');
 dl.innerHTML = [...paths].sort().map(p=>'<option value="'+escapeHtml(p)+'"></option>').join('');
}

function nodeHasPriority(node, prio){
 if(node.items.some(i=>(i.priority||'none')===prio))return true;
 return Object.values(node.children).some(child=>nodeHasPriority(child,prio));
}

function buildTreeHtml(node){
 let html='';
 Object.keys(node.children).forEach(key=>{
  const child=node.children[key];
  const hasHigh=nodeHasPriority(child,'high');
  const hasRev=nodeHasPriority(child,'review');
  const dots=(hasHigh?' 🔴':'')+(hasRev?' 🟡':'');
  html+='<details class="tree-node"><summary><span class="sum-left">'+escapeHtml(key)+dots+'</span><span class="sum-arrow">▾</span></summary><div class="tree-body">'+buildTreeHtml(child)+'</div></details>';
 });
 node.items.forEach(item=>{
  const p=item.priority||'none';
  const badge=p==='high'?'<span class="prio-badge high">🔴 High Priority</span>':(p==='review'?'<span class="prio-badge review">🟡 Needs Review</span>':'');
  html+='<div class="res-item p-'+p+'"><div class="tag"><span>'+escapeHtml(item.subject)+'</span>'+badge+'</div>'+
   (item.note?'<div class="res-note">'+escapeHtml(item.note)+'</div>':'')+
   (item.imgData?'<img src="'+item.imgData+'" onclick="zoomImg(this.src)">':'')+
   '<div class="item-actions">'+
   '<button class="res-edit" onclick="editResource('+item.id+')">Edit / Move</button>'+
   '<button class="res-del" onclick="delResource('+item.id+')">Delete</button>'+
   '</div></div>';
 });
 return html;
}

function renderResources(){
 if(!db) return;
 const subjFilter=document.getElementById('resFilter').value;
 const prioFilter=document.getElementById('resPrioFilter').value;
 const list=document.getElementById('resList');
 db.transaction('items','readonly').objectStore('items').getAll().onsuccess=e=>{
  const rawAll=e.target.result;
  updateTitleSuggestions(rawAll);
  document.getElementById('sub-res').textContent=rawAll.length+' saved';
  const all=rawAll.filter(x=>{
   const matchSubj=subjFilter==='all'||x.subject===subjFilter;
   const matchPrio=prioFilter==='all'||(x.priority||'none')===prioFilter;
   return matchSubj && matchPrio;
  });
  if(!all.length){list.innerHTML='<p class="stats">No matching resources found.</p>';return;}
  const root={children:{},items:[]};
  all.forEach(item=>{
   const parts=item.title.split('/').map(p=>p.trim()).filter(Boolean);
   if(!parts.length)parts.push('Untitled');
   let curr=root;
   parts.forEach(part=>{
    if(!curr.children[part])curr.children[part]={children:{},items:[]};
    curr=curr.children[part];
   });
   curr.items.push(item);
  });
  list.innerHTML=buildTreeHtml(root);
 };
}

function delResource(id){
 if(!confirm('Delete this resource?'))return;
 const tx=db.transaction('items','readwrite');
 tx.objectStore('items').delete(id);
 tx.oncomplete=renderResources;
}

function zoomImg(src){
 document.getElementById('modalImg').src=src;
 document.getElementById('imgModal').style.display='flex';
}

/* Seamless In-Place Overwriting Backup using File System Access API */
let savedFileHandle = null;

async function exportBackup(){
 if(!db)return;
 db.transaction('items','readonly').objectStore('items').getAll().onsuccess=async e=>{
  const payload={
   version:1,
   date:new Date().toISOString(),
   quizState:state,
   resources:e.target.result
  };
  const jsonString=JSON.stringify(payload);

  try{
   if(window.showSaveFilePicker){
    if(!savedFileHandle){
     const opts={
      suggestedName:'mcat-vault-backup.json',
      types:[{
       description:'JSON Backup',
       accept:{'application/json':['.json']}
      }]
     };
     savedFileHandle=await window.showSaveFilePicker(opts);
    }
    const writable=await savedFileHandle.createWritable();
    await writable.write(jsonString);
    await writable.close();
    alert('Backup successfully updated in-place!');
    return;
   }
  }catch(err){
   if(err.name!=='AbortError')savedFileHandle=null;
   else return;
  }

  const blob=new Blob([jsonString],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='mcat-vault-backup.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
 };
}

function importBackup(ev){
 const file=ev.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const data=JSON.parse(e.target.result);
   if(!data.resources||!Array.isArray(data.resources)){alert('Invalid backup file.');return;}
   if(data.quizState){
    state=data.quizState;
    if(!state.eqRetired)state.eqRetired=[];
    if(!state.eqSaved)state.eqSaved=[];
    if(!state.stRetired)state.stRetired=[];
    if(!state.stSaved)state.stSaved=[];
    if(!state.wkState)state.wkState={};
    persist();
    updateEqStats();
    updateStStats();
    updateWkStats();
   }
   const tx=db.transaction('items','readwrite');
   const store=tx.objectStore('items');
   store.clear();
   data.resources.forEach(item=>{
    const clean={title:item.title,subject:item.subject,priority:item.priority||'none',note:item.note,imgData:item.imgData};
    store.add(clean);
   });
   tx.oncomplete=()=>{
    renderResources();
    alert('Restored '+data.resources.length+' resources and progress!');
   };
  }catch(err){
   alert('Could not read backup file.');
  }
  ev.target.value='';
 };
 reader.readAsText(file);
}

updateEqStats();
updateStStats();
updateWkStats();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
