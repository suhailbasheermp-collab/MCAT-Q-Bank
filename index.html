<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<title>MCAT Daily</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#1a1a1a;padding-bottom:40px}
 header{background:#1f3a5f;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
 header h1{font-size:17px;margin:0;white-space:nowrap}
 nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
 nav button{background:none;border:1px solid #fff;color:#fff;border-radius:6px;padding:6px 8px;font-size:12px}
 main{padding:16px;max-width:640px;margin:auto}
 .tag{font-size:12px;color:#555;margin-bottom:8px}
 .q{font-size:18px;line-height:1.4;margin-bottom:16px}
 .opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:1px solid #c5cbd6;border-radius:10px;background:#fff;font-size:16px}
 .opt.correct{background:#d6f5dd;border-color:#2e9e4f}
 .opt.wrong{background:#fadadd;border-color:#c0392b}
 .exp{background:#fff;border-left:4px solid #1f3a5f;padding:12px;margin:14px 0;border-radius:6px}
 .actions{display:flex;gap:10px}
 .actions button{flex:1;padding:14px;border-radius:10px;border:none;font-size:16px;color:#fff}
 .retire{background:#2e9e4f}
 .save{background:#d98e04}
 .stats{font-size:13px;color:#555;margin-top:18px}
 .hidden{display:none}
 select,input,textarea{padding:10px;margin-bottom:10px;font-size:15px;border:1px solid #c5cbd6;border-radius:8px;width:100%;box-sizing:border-box}
 .rev{background:#fff;padding:12px;border-radius:8px;margin:10px 0}
 .rev button{margin-top:8px;padding:8px 12px;border-radius:6px;border:1px solid #999;background:#fff}

 /* Fullscreen Flashcard Overlays (Equations & Structures) */
 .fs-modal{position:fixed;inset:0;background:#f4f6fa;z-index:900;display:none;flex-direction:column;overflow-y:auto}
 .fs-modal header{position:sticky;top:0;z-index:10}
 .fs-wrap{padding:16px;max-width:640px;width:100%;margin:auto;box-sizing:border-box;flex:1;display:flex;flex-direction:column}
 .fs-card{background:#fff;border:1px solid #c5cbd6;border-radius:14px;padding:20px 16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
 .eq-prompt{font-size:19px;font-weight:600;line-height:1.45;margin:10px 0 18px 0}
 .eq-answer-box{background:#eef3fa;border-left:4px solid #1f3a5f;padding:16px;border-radius:8px;margin-bottom:16px}
 .eq-formula{font-size:19px;font-weight:700;color:#1f3a5f;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:8px;word-break:break-word}
 .eq-note{font-size:14px;color:#333;line-height:1.45}
 .reveal-btn{width:100%;padding:16px;background:#1f3a5f;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;margin-top:12px}
 .struct-box{background:#fff;border:1px solid #e5e9f0;border-radius:10px;padding:12px;margin:8px 0}

 /* Resources Section & Nested Toggles */
 .res-section{margin-top:28px;border-top:2px solid #dce1ea;padding-top:18px}
 .res-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
 .res-header h2{font-size:17px;margin:0;color:#1f3a5f}
 .btn-primary{background:#1f3a5f;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:14px}
 .backup-bar{display:flex;gap:8px;margin-bottom:12px}
 .btn-sec{flex:1;background:#fff;color:#1f3a5f;border:1px solid #1f3a5f;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;cursor:pointer}
 .res-form{background:#fff;padding:14px;border-radius:10px;border:1px solid #c5cbd6;margin-bottom:14px}
 .hint{font-size:12px;color:#555;margin:-4px 0 10px 2px}

 details.tree-node{background:#fff;border:1px solid #dce1ea;border-radius:8px;margin-bottom:8px;overflow:hidden}
 details.tree-node details.tree-node{margin:6px 0 6px 12px;border-color:#e2e6ee;background:#fafbfd}
 details.tree-node > summary{padding:11px 14px;font-weight:600;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
 details.tree-node > summary::-webkit-details-marker{display:none}
 details.tree-node > summary::after{content:'▸';color:#1f3a5f;font-size:14px}
 details.tree-node[open] > summary::after{content:'▾'}
 .tree-body{padding:4px 12px 12px 12px;border-top:1px solid #eef1f6}
 .res-item{padding-top:8px}
 .res-item img{width:100%;max-height:260px;object-fit:contain;border-radius:6px;margin-top:8px;background:#fff;border:1px solid #eee;cursor:pointer}
 .res-note{white-space:pre-wrap;font-size:14px;background:#f4f6fa;padding:10px;border-radius:6px;margin-top:6px;font-family:ui-monospace,monospace}
 .res-del{color:#c0392b;border:none;background:none;font-size:13px;padding:4px 0;margin-top:8px;cursor:pointer}

 /* Fullscreen Image Zoom Modal */
 #imgModal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:999;padding:12px}
 #imgModal img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<header>
 <h1>MCAT Daily</h1>
 <nav>
  <button onclick="show('quiz')">Quiz</button>
  <button onclick="show('review')">Review</button>
  <button onclick="openEquations()">Equations</button>
  <button onclick="openStructures()">Structures</button>
 </nav>
</header>
<main>
 <section id="quiz">
  <select id="subject" onchange="nextQuestion()"><option value="all">All subjects</option></select>
  <div id="card"></div>
  <div class="stats" id="stats"></div>
  <details class="stats"><summary>Load report</summary><div id="report" style="white-space:pre-wrap"></div></details>
 </section>

 <section id="review" class="hidden">
  <h2>Saved for review</h2>
  <div id="reviewList"></div>
 </section>

 <!-- Bottom Resources & Study Vault -->
 <section class="res-section" id="resources">
  <div class="res-header">
   <h2>Equations &amp; Charts</h2>
   <button class="btn-primary" onclick="toggleResForm()">+ Add Resource</button>
  </div>

  <div class="backup-bar">
   <button class="btn-sec" onclick="exportBackup()">Download Backup</button>
   <label class="btn-sec" style="margin:0">Restore Backup<input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="importBackup(event)"></label>
  </div>

  <div id="resForm" class="res-form hidden">
   <input type="text" id="resTitle" placeholder="Title / Path (e.g., Hormones / Pituitary / Posterior)">
   <div class="hint">Use <b>/</b> to create nested toggles (Title / Subtitle / Sub-subtitle).</div>
   <select id="resSubj">
    <option value="Biochemistry">Biochemistry</option>
    <option value="Biology">Biology</option>
    <option value="General Chemistry">General Chemistry</option>
    <option value="Organic Chemistry">Organic Chemistry</option>
    <option value="Physics">Physics</option>
    <option value="Psychology and Sociology">Psychology and Sociology</option>
   </select>
   <textarea id="resNote" rows="3" placeholder="Equations or notes (e.g., ADH & Oxytocin)..."></textarea>
   <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Attach chart/photo from phone (optional):</label>
   <input type="file" id="resFile" accept="image/*">
   <div class="actions">
    <button class="retire" onclick="saveResource()">Save</button>
    <button style="background:#7f8c8d" onclick="toggleResForm()">Cancel</button>
   </div>
  </div>

  <select id="resFilter" onchange="renderResources()">
   <option value="all">All saved resources</option>
   <option value="Biochemistry">Biochemistry</option>
   <option value="Biology">Biology</option>
   <option value="General Chemistry">General Chemistry</option>
   <option value="Organic Chemistry">Organic Chemistry</option>
   <option value="Physics">Physics</option>
   <option value="Psychology and Sociology">Psychology and Sociology</option>
  </select>
  <div id="resList"></div>
 </section>
</main>

<!-- Fullscreen Equation Flashcard Modal -->
<div id="eqModal" class="fs-modal">
 <header>
  <h1>Equation Flashcards</h1>
  <nav>
   <button id="eqModeBtn" onclick="toggleEqMode()">Saved (0)</button>
   <button onclick="closeEquations()">Close ✕</button>
  </nav>
 </header>
 <div class="fs-wrap">
  <select id="eqSubj" onchange="nextEq()">
   <option value="all">All subjects</option>
   <option value="Physics">Physics</option>
   <option value="General Chemistry">General Chemistry</option>
   <option value="Organic Chemistry">Organic Chemistry</option>
   <option value="Biochemistry">Biochemistry</option>
   <option value="Biology">Biology</option>
   <option value="Psychology and Sociology">Psychology and Sociology</option>
  </select>
  <div id="eqDeckView">
   <div id="eqCard"></div>
   <div class="stats" id="eqStats"></div>
  </div>
  <div id="eqSavedView" class="hidden">
   <h3>Saved Equations</h3>
   <div id="eqSavedList"></div>
  </div>
 </div>
</div>

<!-- Fullscreen Structure Flashcard Modal -->
<div id="stModal" class="fs-modal">
 <header>
  <h1>Structure ID</h1>
  <nav>
   <button id="stModeBtn" onclick="toggleStMode()">Saved (0)</button>
   <button onclick="closeStructures()">Close ✕</button>
  </nav>
 </header>
 <div class="fs-wrap">
  <select id="stCat" onchange="nextSt()">
   <option value="all">All structures (62)</option>
   <option value="Amino Acids">Amino Acids (20)</option>
   <option value="Bases & Nucleotides">Bases &amp; Nucleosides (6)</option>
   <option value="Carbohydrates">Carbohydrates (8)</option>
   <option value="Vitamins & Cofactors">Vitamins &amp; Cofactors (5)</option>
   <option value="Neurotransmitters & Hormones">Neurotransmitters &amp; Hormones (6)</option>
   <option value="Metabolism & Organic">Metabolism &amp; Lipids (13)</option>
   <option value="Organic Functional Groups">Functional Groups (4)</option>
  </select>
  <div id="stDeckView">
   <div id="stCard"></div>
   <div class="stats" id="stStats"></div>
  </div>
  <div id="stSavedView" class="hidden">
   <h3>Saved Structures</h3>
   <div id="stSavedList"></div>
  </div>
 </div>
</div>

<div id="imgModal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>

<script src="questions.js"></script>
<script src="equations.js"></script>
<script src="structures.js"></script>
<script>
const KEY='mcatState';
let state=JSON.parse(localStorage.getItem(KEY)||'{"retired":[],"saved":[],"eqRetired":[],"eqSaved":[],"stRetired":[],"stSaved":[]}');
if(!state.eqRetired)state.eqRetired=[];
if(!state.eqSaved)state.eqSaved=[];
if(!state.stRetired)state.stRetired=[];
if(!state.stSaved)state.stSaved=[];
let current=null, answered=false;
function persist(){localStorage.setItem(KEY,JSON.stringify(state));}
function inCircle(q){return !state.retired.includes(q.id)&&!state.saved.includes(q.id);}
function initSubjects(){
 const s=[...new Set(QUESTIONS.map(q=>q.subject))];
 const el=document.getElementById('subject');
 s.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;el.appendChild(o);});
}
function nextQuestion(){
 const subj=document.getElementById('subject').value;
 const pool=QUESTIONS.filter(q=>inCircle(q)&&(subj==='all'||q.subject===subj));
 const card=document.getElementById('card');
 answered=false;
 if(!pool.length){card.innerHTML='<p>No questions left in this circle. Check your Review folder.</p>';current=null;updateStats();return;}
 current=pool[Math.floor(Math.random()*pool.length)];
 card.innerHTML='<div class="tag">'+current.subject+' \u00b7 '+current.topic+'</div><div class="q">'+current.q+'</div>'+
  current.options.map((o,i)=>'<button class="opt" onclick="pick('+i+')">'+o+'</button>').join('')+'<div id="after"></div>';
 updateStats();
}
function pick(i){
 if(answered)return; answered=true;
 const btns=document.querySelectorAll('.opt');
 btns.forEach((b,idx)=>{if(idx===current.answer)b.classList.add('correct');else if(idx===i)b.classList.add('wrong');});
 document.getElementById('after').innerHTML='<div class="exp">'+current.explanation+'</div>'+
  '<div class="actions"><button class="retire" onclick="retire()">Mastered, retire it</button><button class="save" onclick="saveIt()">Save for review</button></div>'+
  '<button class="opt" onclick="nextQuestion()" style="margin-top:12px">Keep in circle, next question</button>';
}
function retire(){state.retired.push(current.id);persist();nextQuestion();}
function saveIt(){state.saved.push(current.id);persist();nextQuestion();}
function renderReview(){
 const list=document.getElementById('reviewList');
 const items=QUESTIONS.filter(q=>state.saved.includes(q.id));
 if(!items.length){list.innerHTML='<p>Nothing saved yet.</p>';return;}
 list.innerHTML=items.map(q=>'<div class="rev"><div class="tag">'+q.subject+' \u00b7 '+q.topic+'</div><div>'+q.q+'</div><details><summary>Show answer</summary><p><b>'+q.options[q.answer]+'</b></p><p>'+q.explanation+'</p></details><button onclick="unsave('+q.id+')">Put back in circle</button> <button onclick="retireSaved('+q.id+')">Retire</button></div>').join('');
}
function unsave(id){state.saved=state.saved.filter(x=>x!==id);persist();renderReview();updateStats();}
function retireSaved(id){state.saved=state.saved.filter(x=>x!==id);state.retired.push(id);persist();renderReview();updateStats();}
function updateStats(){
 document.getElementById('stats').textContent='In circle: '+QUESTIONS.filter(inCircle).length+' | Saved: '+state.saved.length+' | Retired: '+state.retired.length+' | Total: '+QUESTIONS.length;
}
function show(which){
 document.getElementById('quiz').classList.toggle('hidden',which!=='quiz');
 document.getElementById('review').classList.toggle('hidden',which!=='review');
 if(which==='review')renderReview();
}

/* Fullscreen Equations Flashcard Logic */
let curEq=null, eqShowingSaved=false;
function eqPool(){return typeof EQUATIONS!=='undefined'?EQUATIONS:[];}
function eqInCircle(e){return !state.eqRetired.includes(e.id)&&!state.eqSaved.includes(e.id);}
function openEquations(){
 eqShowingSaved=false;
 document.getElementById('eqDeckView').classList.remove('hidden');
 document.getElementById('eqSavedView').classList.add('hidden');
 document.getElementById('eqModal').style.display='flex';
 nextEq();
}
function closeEquations(){document.getElementById('eqModal').style.display='none';}
function toggleEqMode(){
 eqShowingSaved=!eqShowingSaved;
 document.getElementById('eqDeckView').classList.toggle('hidden',eqShowingSaved);
 document.getElementById('eqSavedView').classList.toggle('hidden',!eqShowingSaved);
 document.getElementById('eqModeBtn').textContent=eqShowingSaved?'Back to Drill':'Saved ('+state.eqSaved.length+')';
 if(eqShowingSaved)renderEqSaved();
}
function updateEqStats(){
 const all=eqPool();
 document.getElementById('eqStats').textContent='In circle: '+all.filter(eqInCircle).length+' | Saved: '+state.eqSaved.length+' | Retired: '+state.eqRetired.length+' | Total: '+all.length;
 if(!eqShowingSaved)document.getElementById('eqModeBtn').textContent='Saved ('+state.eqSaved.length+')';
}
function nextEq(){
 const subj=document.getElementById('eqSubj').value;
 const pool=eqPool().filter(e=>eqInCircle(e)&&(subj==='all'||e.subject===subj));
 const card=document.getElementById('eqCard');
 if(!pool.length){
  card.innerHTML='<div class="fs-card"><p>No equations left in this circle. Check your Saved list.</p></div>';
  curEq=null;updateEqStats();return;
 }
 curEq=pool[Math.floor(Math.random()*pool.length)];
 card.innerHTML='<div class="fs-card"><div class="tag">'+curEq.subject+' \u00b7 '+curEq.topic+'</div>'+
  '<div class="eq-prompt">'+curEq.q+'</div>'+
  '<button class="reveal-btn" id="revealEqBtn" onclick="revealEq()">Show Equation</button>'+
  '<div id="eqAfter" class="hidden"></div></div>';
 updateEqStats();
}
function revealEq(){
 document.getElementById('revealEqBtn').classList.add('hidden');
 const after=document.getElementById('eqAfter');
 after.classList.remove('hidden');
 after.innerHTML='<div class="eq-answer-box"><div class="eq-formula">'+curEq.eq+'</div>'+
  (curEq.note?'<div class="eq-note">'+curEq.note+'</div>':'')+'</div>'+
  '<div class="actions"><button class="retire" onclick="retireEq()">Mastered, retire it</button><button class="save" onclick="saveEq()">Save for review</button></div>'+
  '<button class="opt" onclick="nextEq()" style="margin-top:12px">Keep in circle, next equation</button>';
}
function retireEq(){state.eqRetired.push(curEq.id);persist();nextEq();}
function saveEq(){state.eqSaved.push(curEq.id);persist();nextEq();}
function renderEqSaved(){
 const list=document.getElementById('eqSavedList');
 const items=eqPool().filter(e=>state.eqSaved.includes(e.id));
 if(!items.length){list.innerHTML='<p>No equations saved yet.</p>';return;}
 list.innerHTML=items.map(e=>'<div class="rev"><div class="tag">'+e.subject+' \u00b7 '+e.topic+'</div><div><b>'+e.q+'</b></div>'+
  '<div class="eq-formula" style="font-size:17px;margin-top:8px">'+e.eq+'</div>'+
  (e.note?'<div class="eq-note" style="margin-bottom:8px">'+e.note+'</div>':'')+
  '<button onclick="unsaveEq('+e.id+')">Put back in circle</button> <button onclick="retireSavedEq('+e.id+')">Retire</button></div>').join('');
}
function unsaveEq(id){state.eqSaved=state.eqSaved.filter(x=>x!==id);persist();renderEqSaved();updateEqStats();}
function retireSavedEq(id){state.eqSaved=state.eqSaved.filter(x=>x!==id);state.eqRetired.push(id);persist();renderEqSaved();updateEqStats();}

/* Fullscreen Structures Flashcard Logic */
let curSt=null, stShowingSaved=false;
function stPool(){return typeof STRUCTURES!=='undefined'?STRUCTURES:[];}
function stInCircle(s){return !state.stRetired.includes(s.id)&&!state.stSaved.includes(s.id);}
function openStructures(){
 stShowingSaved=false;
 document.getElementById('stDeckView').classList.remove('hidden');
 document.getElementById('stSavedView').classList.add('hidden');
 document.getElementById('stModal').style.display='flex';
 nextSt();
}
function closeStructures(){document.getElementById('stModal').style.display='none';}
function toggleStMode(){
 stShowingSaved=!stShowingSaved;
 document.getElementById('stDeckView').classList.toggle('hidden',stShowingSaved);
 document.getElementById('stSavedView').classList.toggle('hidden',!stShowingSaved);
 document.getElementById('stModeBtn').textContent=stShowingSaved?'Back to Drill':'Saved ('+state.stSaved.length+')';
 if(stShowingSaved)renderStSaved();
}
function updateStStats(){
 const all=stPool();
 document.getElementById('stStats').textContent='In circle: '+all.filter(stInCircle).length+' | Saved: '+state.stSaved.length+' | Retired: '+state.stRetired.length+' | Total: '+all.length;
 if(!stShowingSaved)document.getElementById('stModeBtn').textContent='Saved ('+state.stSaved.length+')';
}
function nextSt(){
 const cat=document.getElementById('stCat').value;
 const pool=stPool().filter(s=>stInCircle(s)&&(cat==='all'||s.cat===cat));
 const card=document.getElementById('stCard');
 if(!pool.length){
  card.innerHTML='<div class="fs-card"><p>No structures left in this circle. Check your Saved list.</p></div>';
  curSt=null;updateStStats();return;
 }
 curSt=pool[Math.floor(Math.random()*pool.length)];
 card.innerHTML='<div class="fs-card"><div class="tag">Identify this structure</div>'+
  '<div class="struct-box">'+curSt.svg+'</div>'+
  '<button class="reveal-btn" id="revealStBtn" onclick="revealSt()">Flip / Show Structure Name</button>'+
  '<div id="stAfter" class="hidden"></div></div>';
 updateStStats();
}
function revealSt(){
 document.getElementById('revealStBtn').classList.add('hidden');
 const after=document.getElementById('stAfter');
 after.classList.remove('hidden');
 after.innerHTML='<div class="eq-answer-box" style="margin-top:12px"><div class="tag" style="margin-bottom:4px">'+curSt.cat+'</div>'+
  '<div class="eq-formula" style="font-family:system-ui,sans-serif">'+curSt.name+'</div>'+
  '<div class="eq-note">'+curSt.info+'</div></div>'+
  '<div class="actions"><button class="retire" onclick="retireSt()">Mastered, retire it</button><button class="save" onclick="saveSt()">Save for review</button></div>'+
  '<button class="opt" onclick="nextSt()" style="margin-top:12px">Keep in circle, next structure</button>';
}
function retireSt(){state.stRetired.push(curSt.id);persist();nextSt();}
function saveSt(){state.stSaved.push(curSt.id);persist();nextSt();}
function renderStSaved(){
 const list=document.getElementById('stSavedList');
 const items=stPool().filter(s=>state.stSaved.
