<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<title>MCAT Daily</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#1a1a1a;padding-bottom:44px}
 header{background:#1f3a5f;color:#fff;padding:14px 16px;display:flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
 .logo{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid #fff;box-shadow:0 0 6px rgba(255,255,255,0.4)}
 header h1{font-size:19px;margin:0;letter-spacing:0.3px}
 main{padding:16px;max-width:640px;margin:auto}

 /* Large Central Tabs */
 .hub-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
 .hub-tab{background:#fff;border:2px solid #d5dce6;border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.04);transition:all 0.15s ease;color:#1f3a5f}
 .hub-tab .tab-icon{font-size:24px;line-height:1}
 .hub-tab .tab-title{font-size:14px;font-weight:700}
 .hub-tab .tab-sub{font-size:11px;color:#555;font-weight:500}
 .hub-tab.active{background:#1f3a5f;border-color:#1f3a5f;color:#fff;box-shadow:0 4px 12px rgba(31,58,95,0.28)}
 .hub-tab.active .tab-sub{color:#d6e2f2}

 .tab-panel{display:none}
 .tab-panel.active{display:block}

 .tag{font-size:12px;color:#555;margin-bottom:8px}
 .opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:1px solid #c5cbd6;border-radius:10px;background:#fff;font-size:16px;cursor:pointer}
 .actions{display:flex;gap:10px}
 .actions button{flex:1;padding:14px;border-radius:10px;border:none;font-size:16px;color:#fff;font-weight:600;cursor:pointer}
 .retire{background:#2e9e4f}
 .save{background:#d98e04}
 .stats{font-size:13px;color:#555;margin-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
 .reset-link{background:none;border:none;color:#1f3a5f;text-decoration:underline;font-size:12px;padding:0;cursor:pointer}
 .hidden{display:none}
 select,input{padding:10px;margin-bottom:10px;font-size:15px;border:1px solid #c5cbd6;border-radius:8px;width:100%;box-sizing:border-box;background:#fff}
 .rev{background:#fff;padding:12px;border-radius:8px;margin:10px 0;border:1px solid #dce1ea}
 .rev button{margin-top:8px;padding:8px 12px;border-radius:6px;border:1px solid #999;background:#fff;cursor:pointer}

 /* Sub-bar inside Equations & Structures Tabs */
 .sub-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
 .sub-bar h2{font-size:17px;margin:0;color:#1f3a5f}
 .pill-btn{background:#fff;color:#1f3a5f;border:1.5px solid #1f3a5f;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
 .pill-btn.active{background:#1f3a5f;color:#fff}

 /* Flashcard Styling */
 .fs-card{background:#fff;border:1px solid #c5cbd6;border-radius:14px;padding:20px 16px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
 .eq-prompt{font-size:19px;font-weight:600;line-height:1.45;margin:10px 0 18px 0}
 .eq-answer-box{background:#eef3fa;border-left:4px solid #1f3a5f;padding:16px;border-radius:8px;margin-bottom:16px}
 .eq-formula{font-size:19px;font-weight:700;color:#1f3a5f;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:8px;word-break:break-word}
 .eq-note{font-size:14px;color:#333;line-height:1.45}
 .reveal-btn{width:100%;padding:16px;background:#1f3a5f;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer}
 .struct-box{background:#fff;border:1px solid #e5e9f0;border-radius:10px;padding:12px;margin:8px 0}

 /* Rich Paste Box for Android Image & Text Pasting */
 .rich-box{min-height:76px;padding:10px;margin-bottom:8px;font-size:15px;border:1px solid #c5cbd6;border-radius:8px;background:#fff;white-space:pre-wrap;word-break:break-word;outline:none}
 .rich-box:empty::before{content:attr(data-placeholder);color:#888}
 .rich-box img{max-width:100%;max-height:160px;display:block;margin-top:6px;border-radius:6px}
 .paste-btn{width:100%;padding:10px;margin-bottom:10px;background:#eef3fa;color:#1f3a5f;border:1px dashed #1f3a5f;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}

 /* Resources Section & Nested Toggles */
 .res-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
 .res-header h2{font-size:17px;margin:0;color:#1f3a5f}
 .btn-primary{background:#1f3a5f;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
 .backup-bar{display:flex;gap:8px;margin-bottom:12px}
 .btn-sec{flex:1;background:#fff;color:#1f3a5f;border:1px solid #1f3a5f;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;cursor:pointer}
 .res-form{background:#fff;padding:14px;border-radius:10px;border:1px solid #c5cbd6;margin-bottom:14px}
 .hint{font-size:12px;color:#555;margin:-4px 0 10px 2px}

 details.tree-node{background:#fff;border:1px solid #dce1ea;border-radius:8px;margin-bottom:8px;overflow:hidden}
 details.tree-node details.tree-node{margin:6px 0 6px 12px;border-color:#e2e6ee;background:#fafbfd}
 details.tree-node > summary{padding:11px 14px;font-weight:600;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
 details.tree-node > summary::-webkit-details-marker{display:none}
 details.tree-node > summary::after{content:'▸';color:#1f3a5f;font-size:14px}
 details.tree-node[open] > summary::after{content:'▾'}
 .tree-body{padding:4px 12px 12px 12px;border-top:1px solid #eef1f6}
 .res-item{padding-top:8px}
 .res-item img{width:100%;max-height:260px;object-fit:contain;border-radius:6px;margin-top:8px;background:#fff;border:1px solid #eee;cursor:pointer}
 .res-note{white-space:pre-wrap;font-size:14px;background:#f4f6fa;padding:10px;border-radius:6px;margin-top:6px;font-family:ui-monospace,monospace}
 .res-del{color:#c0392b;border:none;background:none;font-size:13px;padding:4px 0;margin-top:8px;cursor:pointer}

 /* Fullscreen Image Zoom Modal */
 #imgModal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:999;padding:12px}
 #imgModal img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<header>
 <img class="logo" src="logo.png" alt="MCAT Daily" onerror="this.style.display='none'">
 <h1>MCAT Daily</h1>
</header>

<main>
 <!-- 3 Large Central Navigation Tabs -->
 <div class="hub-tabs" role="tablist">
  <button class="hub-tab active" id="tab-res" onclick="switchTab('res')">
   <span class="tab-icon">🗂️</span>
   <span class="tab-title">Resources</span>
   <span class="tab-sub" id="sub-res">Notes &amp; Charts</span>
  </button>
  <button class="hub-tab" id="tab-eq" onclick="switchTab('eq')">
   <span class="tab-icon">∑</span>
   <span class="tab-title">Equations</span>
   <span class="tab-sub" id="sub-eq">125 Formulas</span>
  </button>
  <button class="hub-tab" id="tab-st" onclick="switchTab('st')">
   <span class="tab-icon">🧬</span>
   <span class="tab-title">Structures</span>
   <span class="tab-sub" id="sub-st">62 Molecules</span>
  </button>
 </div>

 <!-- TAB 1: RESOURCES & ADD RESOURCE -->
 <section id="panel-res" class="tab-panel active">
  <div class="res-header">
   <h2>Study Vault</h2>
   <button class="btn-primary" onclick="toggleResForm()">+ Add Resource</button>
  </div>

  <div class="backup-bar">
   <button class="btn-sec" onclick="exportBackup()">Download Backup</button>
   <label class="btn-sec" style="margin:0">Restore Backup<input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="importBackup(event)"></label>
  </div>

  <div id="resForm" class="res-form hidden">
   <input type="text" id="resTitle" placeholder="Title / Path (e.g., Hormones / Pituitary / Posterior)">
   <div class="hint">Use <b>/</b> to create nested toggles (Title / Subtitle / Sub-subtitle).</div>
   <select id="resSubj">
    <option value="Biochemistry">Biochemistry</option>
    <option value="Biology">Biology</option>
    <option value="General Chemistry">General Chemistry</option>
    <option value="Organic Chemistry">Organic Chemistry</option>
    <option value="Physics">Physics</option>
    <option value="Psychology and Sociology">Psychology and Sociology</option>
   </select>
   <div id="resNote" class="rich-box" contenteditable="true" data-placeholder="Type notes OR paste copied image here..."></div>
   <button type="button" class="paste-btn" onclick="pasteFromClipboard()">📋 Paste Copied Image from Clipboard</button>
   <div id="pastePreview"></div>
   <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Or attach chart/photo from phone (optional):</label>
   <input type="file" id="resFile" accept="image/*">
   <div class="actions">
    <button class="retire" onclick="saveResource()">Save</button>
    <button style="background:#7f8c8d" onclick="toggleResForm()">Cancel</button>
   </div>
  </div>

  <select id="resFilter" onchange="renderResources()">
   <option value="all">All saved resources</option>
   <option value="Biochemistry">Biochemistry</option>
   <option value="Biology">Biology</option>
   <option value="General Chemistry">General Chemistry</option>
   <option value="Organic Chemistry">Organic Chemistry</option>
   <option value="Physics">Physics</option>
   <option value="Psychology and Sociology">Psychology and Sociology</option>
  </select>
  <div id="resList"></div>
 </section>

 <!-- TAB 2: EQUATIONS DRILL -->
 <section id="panel-eq" class="tab-panel">
  <div class="sub-bar">
   <h2>Equation Flashcards</h2>
   <button class="pill-btn" id="eqModeBtn" onclick="toggleEqMode()">Saved (0)</button>
  </div>
  <select id="eqSubj" onchange="nextEq()">
   <option value="all">All subjects</option>
   <option value="Physics">Physics</option>
   <option value="General Chemistry">General Chemistry</option>
   <option value="Organic Chemistry">Organic Chemistry</option>
   <option value="Biochemistry">Biochemistry</option>
   <option value="Biology">Biology</option>
   <option value="Psychology and Sociology">Psychology and Sociology</option>
  </select>
  <div id="eqDeckView">
   <div id="eqCard"></div>
   <div class="stats">
    <span id="eqStats"></span>
    <button class="reset-link" onclick="resetRetired('eq')">Reset Retired</button>
   </div>
  </div>
  <div id="eqSavedView" class="hidden">
   <h3>Saved Equations</h3>
   <div id="eqSavedList"></div>
  </div>
 </section>

 <!-- TAB 3: STRUCTURES DRILL -->
 <section id="panel-st" class="tab-panel">
  <div class="sub-bar">
   <h2>Structure Identification</h2>
   <button class="pill-btn" id="stModeBtn" onclick="toggleStMode()">Saved (0)</button>
  </div>
  <select id="stCat" onchange="nextSt()">
   <option value="all">All structures (62)</option>
   <option value="Amino Acids">Amino Acids (20)</option>
   <option value="Bases & Nucleotides">Bases &amp; Nucleosides (6)</option>
   <option value="Carbohydrates">Carbohydrates (8)</option>
   <option value="Vitamins & Cofactors">Vitamins &amp; Cofactors (5)</option>
   <option value="Neurotransmitters & Hormones">Neurotransmitters &amp; Hormones (6)</option>
   <option value="Metabolism & Organic">Metabolism &amp; Lipids (13)</option>
   <option value="Organic Functional Groups">Functional Groups (4)</option>
  </select>
  <div id="stDeckView">
   <div id="stCard"></div>
   <div class="stats">
    <span id="stStats"></span>
    <button class="reset-link" onclick="resetRetired('st')">Reset Retired</button>
   </div>
  </div>
  <div id="stSavedView" class="hidden">
   <h3>Saved Structures</h3>
   <div id="stSavedList"></div>
  </div>
 </section>
</main>

<div id="imgModal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>

<script src="equations.js"></script>
<script src="structures.js"></script>
<script>
const KEY='mcatState';
let state;
try {
 state=JSON.parse(localStorage.getItem(KEY)||'{"eqRetired":[],"eqSaved":[],"stRetired":[],"stSaved":[]}');
} catch(e) {
 state={"eqRetired":[],"eqSaved":[],"stRetired":[],"stSaved":[]};
}
if(!state.eqRetired)state.eqRetired=[];
if(!state.eqSaved)state.eqSaved=[];
if(!state.stRetired)state.stRetired=[];
if(!state.stSaved)state.stSaved=[];

function persist(){localStorage.setItem(KEY,JSON.stringify(state));}

/* Central Tab Switcher */
function switchTab(which){
 ['res','eq','st'].forEach(t=>{
  document.getElementById('tab-'+t).classList.toggle('active',t===which);
  document.getElementById('panel-'+t).classList.toggle('active',t===which);
 });
 if(which==='eq'){
  eqShowingSaved=false;
  document.getElementById('eqDeckView').classList.remove('hidden');
  document.getElementById('eqSavedView').classList.add('hidden');
  nextEq();
 }
 if(which==='st'){
  stShowingSaved=false;
  document.getElementById('stDeckView').classList.remove('hidden');
  document.getElementById('stSavedView').classList.add('hidden');
  nextSt();
 }
}

function resetRetired(type){
 if(!confirm('Put all retired cards back into the circle?'))return;
 if(type==='eq'){state.eqRetired=[];persist();nextEq();}
 if(type==='st'){state.stRetired=[];persist();nextSt();}
}

/* Equations Flashcard Logic */
let curEq=null, eqShowingSaved=false;
function eqPool(){return typeof EQUATIONS!=='undefined'?EQUATIONS:[];}
function eqInCircle(e){return e && e.id && !state.eqRetired.includes(e.id)&&!state.eqSaved.includes(e.id);}
function toggleEqMode(){
 eqShowingSaved=!eqShowingSaved;
 document.getElementById('eqDeckView').classList.toggle('hidden',eqShowingSaved);
 document.getElementById('eqSavedView').classList.toggle('hidden',!eqShowingSaved);
 const btn=document.getElementById('eqModeBtn');
 btn.classList.toggle('active',eqShowingSaved);
 btn.textContent=eqShowingSaved?'Back to Drill':'Saved ('+state.eqSaved.length+')';
 if(eqShowingSaved)renderEqSaved();
}
function updateEqStats(){
 const all=eqPool();
 const inC=all.filter(eqInCircle).length;
 document.getElementById('eqStats').textContent='Circle: '+inC+' | Saved: '+state.eqSaved.length+' | Retired: '+state.eqRetired.length;
 document.getElementById('sub-eq').textContent=inC+' left';
 if(!eqShowingSaved){
  const btn=document.getElementById('eqModeBtn');
  btn.classList.remove('active');
  btn.textContent='Saved ('+state.eqSaved.length+')';
 }
}
function nextEq(){
 const subj=document.getElementById('eqSubj').value;
 const pool=eqPool().filter(e=>eqInCircle(e)&&(subj==='all'||e.subject===subj));
 const card=document.getElementById('eqCard');
 if(!pool.length){
  card.innerHTML='<div class="fs-card"><p>No equations left in this circle. Check Saved or tap Reset Retired.</p></div>';
  curEq=null;updateEqStats();return;
 }
 curEq=pool[Math.floor(Math.random()*pool.length)];
 card.innerHTML='<div class="fs-card"><div class="tag">'+curEq.subject+' \u00b7 '+curEq.topic+'</div>'+
  '<div class="eq-prompt">'+curEq.q+'</div>'+
  '<button class="reveal-btn" id="revealEqBtn" onclick="revealEq()">Show Equation</button>'+
  '<div id="eqAfter" class="hidden"></div></div>';
 updateEqStats();
}
function revealEq(){
 document.getElementById('revealEqBtn').classList.add('hidden');
 const after=document.getElementById('eqAfter');
 after.classList.remove('hidden');
 after.innerHTML='<div class="eq-answer-box"><div class="eq-formula">'+curEq.eq+'</div>'+
  (curEq.note?'<div class="eq-note">'+curEq.note+'</div>':'')+'</div>'+
  '<div class="actions"><button class="retire" onclick="retireEq()">Mastered, retire it</button><button class="save" onclick="saveEq()">Save for review</button></div>'+
  '<button class="opt" onclick="nextEq()" style="margin-top:12px">Keep in circle, next equation</button>';
}
function retireEq(){state.eqRetired.push(curEq.id);persist();nextEq();}
function saveEq(){state.eqSaved.push(curEq.id);persist();nextEq();}
function renderEqSaved(){
 const list=document.getElementById('eqSavedList');
 const items=eqPool().filter(e=>e && state.eqSaved.includes(e.id));
 if(!items.length){list.innerHTML='<p>No equations saved yet.</p>';return;}
 list.innerHTML=items.map(e=>'<div class="rev"><div class="tag">'+e.subject+' \u00b7 '+e.topic+'</div><div><b>'+e.q+'</b></div>'+
  '<div class="eq-formula" style="font-size:17px;margin-top:8px">'+e.eq+'</div>'+
  (e.note?'<div class="eq-note" style="margin-bottom:8px">'+e.note+'</div>':'')+
  '<button onclick="unsaveEq('+e.id+')">Put back in circle</button> <button onclick="retireSavedEq('+e.id+')">Retire</button></div>').join('');
}
function unsaveEq(id){state.eqSaved=state.eqSaved.filter(x=>x!==id);persist();renderEqSaved();updateEqStats();}
function retireSavedEq(id){state.eqSaved=state.eqSaved.filter(x=>x!==id);state.eqRetired.push(id);persist();renderEqSaved();updateEqStats();}

/* Structures Flashcard Logic */
let curSt=null, stShowingSaved=false;
function stPool(){return typeof STRUCTURES!=='undefined'?STRUCTURES:[];}
function stInCircle(s){return s && s.id && !state.stRetired.includes(s.id)&&!state.stSaved.includes(s.id);}
function toggleStMode(){
 stShowingSaved=!stShowingSaved;
 document.getElementById('stDeckView').classList.toggle('hidden',stShowingSaved);
 document.getElementById('stSavedView').classList.toggle('hidden',!stShowingSaved);
 const btn=document.getElementById('stModeBtn');
 btn.classList.toggle('active',stShowingSaved);
 btn.textContent=stShowingSaved?'Back to Drill':'Saved ('+state.stSaved.length+')';
 if(stShowingSaved)renderStSaved();
}
function updateStStats(){
 const all=stPool();
 const inC=all.filter(stInCircle).length;
 document.getElementById('stStats').textContent='Circle: '+inC+' | Saved: '+state.stSaved.length+' | Retired: '+state.stRetired.length;
 document.getElementById('sub-st').textContent=inC+' left';
 if(!stShowingSaved){
  const btn=document.getElementById('stModeBtn');
  btn.classList.remove('active');
  btn.textContent='Saved ('+state.stSaved.length+')';
 }
}
function nextSt(){
 const cat=document.getElementById('stCat').value;
 const pool=stPool().filter(s=>stInCircle(s)&&(cat==='all'||s.cat===cat));
 const card=document.getElementById('stCard');
 if(!pool.length){
  card.innerHTML='<div class="fs-card"><p>No structures left in this circle. Check Saved or tap Reset Retired.</p></div>';
  curSt=null;updateStStats();return;
 }
 curSt=pool[Math.floor(Math.random()*pool.length)];
 card.innerHTML='<div class="fs-card"><div class="tag">Identify this structure</div>'+
  '<div class="struct-box">'+curSt.svg+'</div>'+
  '<button class="reveal-btn" id="revealStBtn" onclick="revealSt()">Flip / Show Structure Name</button>'+
  '<div id="stAfter" class="hidden"></div></div>';
 updateStStats();
}
function revealSt(){
 document.getElementById('revealStBtn').classList.add('hidden');
 const after=document.getElementById('stAfter');
 after.classList.remove('hidden');
 after.innerHTML='<div class="eq-answer-box" style="margin-top:12px"><div class="tag" style="margin-bottom:4px">'+curSt.cat+'</div>'+
  '<div class="eq-formula" style="font-family:system-ui,sans-serif">'+curSt.name+'</div>'+
  '<div class="eq-note">'+curSt.info+'</div></div>'+
  '<div class="actions"><button class="retire" onclick="retireSt()">Mastered, retire it</button><button class="save" onclick="saveSt()">Save for review</button></div>'+
  '<button class="opt" onclick="nextSt()" style="margin-top:12px">Keep in circle, next structure</button>';
}
function retireSt(){state.stRetired.push(curSt.id);persist();nextSt();}
function saveSt(){state.stSaved.push(curSt.id);persist();nextSt();}
function renderStSaved(){
 const list=document.getElementById('stSavedList');
 const items=stPool().filter(s=>s && state.stSaved.includes(s.id));
 if(!items.length){list.innerHTML='<p>No structures saved yet.</p>';return;}
 list.innerHTML=items.map(s=>'<div class="rev"><div class="tag">'+s.cat+'</div><div><b>'+s.name+'</b></div>'+
  '<div class="struct-box">'+s.svg+'</div>'+
  '<div class="eq-note" style="margin-bottom:8px">'+s.info+'</div>'+
  '<button onclick="unsaveSt('+s.id+')">Put back in circle</button> <button onclick="retireSavedSt('+s.id+')">Retire</button></div>').join('');
}
function unsaveSt(id){state.stSaved=state.stSaved.filter(x=>x!==id);persist();renderStSaved();updateStStats();}
function retireSavedSt(id){state.stSaved=state.stSaved.filter(x=>x!==id);state.stRetired.push(id);persist();renderStSaved();updateStStats();}

/* IndexedDB Storage + Direct Android Image Paste for Nested Resources */
let db;
const req=indexedDB.open('mcatResourcesDB',1);
req.onupgradeneeded=e=>{e.target.result.createObjectStore('items',{keyPath:'id',autoIncrement:true});};
req.onsuccess=e=>{db=e.target.result;renderResources();};

let pastedImgData = null;

function setPastedPreview(dataUrl){
 pastedImgData = dataUrl;
 document.getElementById('pastePreview').innerHTML =
  '<div style="margin:6px 0">' +
  '<img src="' + dataUrl + '" style="max-height:150px;border-radius:6px;border:1px solid #c5cbd6">' +
  '<button type="button" onclick="clearPastedImg()" style="display:block;color:#c0392b;background:none;border:none;font-size:12px;padding:4px 0;cursor:pointer">Remove pasted image</button></div>';
}

function clearPastedImg(){
 pastedImgData = null;
 document.getElementById('pastePreview').innerHTML = '';
}

function toggleResForm(){
 document.getElementById('resForm').classList.toggle('hidden');
 clearPastedImg();
}

function compressImage(file){
 return new Promise(resolve=>{
  const reader=new FileReader();
  reader.onload=e=>{
   const img=new Image();
   img.onload=()=>{
    const canvas=document.createElement('canvas');
    const maxW=1200;
    const scale=img.width>maxW?maxW/img.width:1;
    canvas.width=img.width*scale;
    canvas.height=img.height*scale;
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL('image/jpeg',0.8));
   };
   img.src=e.target.result;
  };
  reader.readAsDataURL(file);
 });
}

const noteBox = document.getElementById('resNote');
noteBox.addEventListener('paste', async function(e){
 const cd = e.clipboardData || e.originalEvent.clipboardData;
 if(cd && cd.items){
  for(let i=0;i<cd.items.length;i++){
   if(cd.items[i].type.indexOf('image')!==-1){
    e.preventDefault();
    const blob = cd.items[i].getAsFile();
    const dataUrl = await compressImage(blob);
    setPastedPreview(dataUrl);
    return;
   }
  }
 }
 setTimeout(async ()=>{
  const embedded = noteBox.querySelector('img');
  if(embedded){
   const src = embedded.src;
   embedded.remove();
   if(src.startsWith('data:image')) setPastedPreview(src);
  }
 }, 60);
});

async function pasteFromClipboard(){
 try{
  if(!navigator.clipboard || !navigator.clipboard.read){
   alert('Tap inside the notes box above and tap Paste on your keyboard.');
   return;
  }
  const items = await navigator.clipboard.read();
  for(const item of items){
   const imgType = item.types.find(t => t.startsWith('image/'));
   if(imgType){
    const blob = await item.getType(imgType);
    const dataUrl = await compressImage(blob);
    setPastedPreview(dataUrl);
    return;
   }
  }
  alert('No image found in clipboard. Copy an image from Chrome first.');
 }catch(err){
  alert('Tap inside the notes box above and select Paste from your keyboard.');
 }
}

async function saveResource(){
 const title=document.getElementById('resTitle').value.trim();
 const subject=document.getElementById('resSubj').value;
 const note=noteBox.innerText.trim();
 const file=document.getElementById('resFile').files[0];
 if(!title&&!note&&!file&&!pastedImgData){alert('Add a title, equation, or photo first.');return;}
 let imgData=pastedImgData;
 if(file)imgData=await compressImage(file);
 const tx=db.transaction('items','readwrite');
 tx.objectStore('items').add({title:title||'Untitled Resource',subject,note,imgData});
 tx.oncomplete=()=>{
  document.getElementById('resTitle').value='';
  noteBox.innerHTML='';
  document.getElementById('resFile').value='';
  clearPastedImg();
  toggleResForm();
  renderResources();
 };
}

function escapeHtml(s){
 return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
}

function buildTreeHtml(node){
 let html='';
 Object.keys(node.children).forEach(key=>{
  html+='<details class="tree-node"><summary>'+escapeHtml(key)+'</summary><div class="tree-body">'+buildTreeHtml(node.children[key])+'</div></details>';
 });
 node.items.forEach(item=>{
  html+='<div class="res-item"><div class="tag">'+escapeHtml(item.subject)+'</div>'+
   (item.note?'<div class="res-note">'+escapeHtml(item.note)+'</div>':'')+
   (item.imgData?'<img src="'+item.imgData+'" onclick="zoomImg(this.src)">':'')+
   '<div><button class="res-del" onclick="delResource('+item.id+')">Delete</button></div></div>';
 });
 return html;
}

function renderResources(){
 if(!db) return;
 const filter=document.getElementById('resFilter').value;
 const list=document.getElementById('resList');
 db.transaction('items','readonly').objectStore('items').getAll().onsuccess=e=>{
  const totalAll=e.target.result.length;
  document.getElementById('sub-res').textContent=totalAll+' saved';
  const all=e.target.result.filter(x=>filter==='all'||x.subject===filter);
  if(!all.length){list.innerHTML='<p class="stats">No equations or charts saved yet.</p>';return;}
  const root={children:{},items:[]};
  all.forEach(item=>{
   const parts=item.title.split('/').map(p=>p.trim()).filter(Boolean);
   if(!parts.length)parts.push('Untitled');
   let curr=root;
   parts.forEach(part=>{
    if(!curr.children[part])curr.children[part]={children:{},items:[]};
    curr=curr.children[part];
   });
   curr.items.push(item);
  });
  list.innerHTML=buildTreeHtml(root);
 };
}

function delResource(id){
 const tx=db.transaction('items','readwrite');
 tx.objectStore('items').delete(id);
 tx.oncomplete=renderResources;
}

function zoomImg(src){
 document.getElementById('modalImg').src=src;
 document.getElementById('imgModal').style.display='flex';
}

/* Export & Restore All Resources + Drill State */
function exportBackup(){
 if(!db)return;
 db.transaction('items','readonly').objectStore('items').getAll().onsuccess=e=>{
  const payload={
   version:1,
   date:new Date().toISOString(),
   quizState:state,
   resources:e.target.result
  };
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='mcat-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
 };
}

function importBackup(ev){
 const file=ev.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const data=JSON.parse(e.target.result);
   if(!data.resources||!Array.isArray(data.resources)){alert('Invalid backup file.');return;}
   if(data.quizState){
    state=data.quizState;
    if(!state.eqRetired)state.eqRetired=[];
    if(!state.eqSaved)state.eqSaved=[];
    if(!state.stRetired)state.stRetired=[];
    if(!state.stSaved)state.stSaved=[];
    persist();
    updateEqStats();
    updateStStats();
   }
   const tx=db.transaction('items','readwrite');
   const store=tx.objectStore('items');
   store.clear();
   data.resources.forEach(item=>{
    const clean={title:item.title,subject:item.subject,note:item.note,imgData:item.imgData};
    store.add(clean);
   });
   tx.oncomplete=()=>{
    renderResources();
    alert('Restored '+data.resources.length+' resources and progress!');
   };
  }catch(err){
   alert('Could not read backup file.');
  }
  ev.target.value='';
 };
 reader.readAsText(file);
}

updateEqStats();
updateStStats();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
